components:
  messages:
    Authenticate:
      name: Authenticate
      title: Authenticate
      summary: Authenticate with the server.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Authenticate
          token:
            type: string
        required:
          - type
          - token
    BeginTyping:
      name: BeginTyping
      title: BeginTyping
      summary: Tell other users that you have begun typing in a channel.
      description: Must be in the specified channel or nothing will happen.
      payload:
        type: object
        properties:
          type:
            type: string
            const: BeginTyping
          channel:
            type: string
            description: channel_id
        required:
          - type
          - channel
    EndTyping:
      name: EndTyping
      title: EndTyping
      summary: Tell other users that you have stopped typing in a channel.
      description: Must be in the specified channel or nothing will happen.
      payload:
        type: object
        properties:
          type:
            type: string
            const: EndTyping
          channel:
            type: string
            description: channel_id
        required:
          - type
          - channel
    Ping:
      name: Ping
      title: Ping
      summary: Ping the server, you can specify a timestamp that you'll receive back.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Ping
          data:
            type: number
        required:
          - type
          - data
    Subscribe:
      name: Subscribe
      title: Subscribe
      summary: Subscribe to a server's UserUpdate events.
      description: |
        Implementation notes:
        - Subscriptions automatically expire within 15 minutes.
        - A client may have up to 5 active subscriptions.
        - This has no effect on bot sessions.
        - This event should only be sent **iff** app/client is in focus.
        - You should aim to send this event at most every 10 minutes per server.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Subscribe
          server_id:
            type: string
        required:
          - type
          - server_id
    ErrorEvent:
      name: Error
      title: Error
      summary: An error occurred which meant you couldn't authenticate.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Error
          error:
            type: string
            description: |
              One of:
              - `LabelMe`: uncategorised error
              - `InternalError`: the server ran into an issue
              - `InvalidSession`: authentication details are incorrect
              - `OnboardingNotFinished`: user has not chosen a username
              - `AlreadyAuthenticated`: this connection is already authenticated
            enum:
              - LabelMe
              - InternalError
              - InvalidSession
              - OnboardingNotFinished
              - AlreadyAuthenticated
        required:
          - type
          - error
    Authenticated:
      name: Authenticated
      title: Authenticated
      summary: The server has authenticated your connection and you will shortly start receiving data.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Authenticated
        required:
          - type
    Logout:
      name: Logout
      title: Logged Out
      summary: The current user session has been invalidated or the bot token has been reset.
      description: Your connection will be closed shortly after.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Logout
        required:
          - type
    Bulk:
      name: Bulk
      title: Bulk
      summary: Several events have been sent, process each item of `v` as its own event.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Bulk
          v:
            type: array
            items: {}
        required:
          - type
          - v
    Pong:
      name: Pong
      title: Pong
      summary: Ping response from the server.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Pong
          data:
            type: number
        required:
          - type
          - data
    Ready:
      name: Ready
      title: Ready
      summary: Data for use by client, data structures match the API specification.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Ready
          users:
            type: array
            items: {}
          servers:
            type: array
            items: {}
          channels:
            type: array
            items: {}
          members:
            type: array
            items: {}
          emojis:
            type: array
            items: {}
          user_settings:
            type: array
            items: {}
          channel_unreads:
            type: array
            items: {}
          policy_changes:
            type: array
            items: {}
        required:
          - type
    Message:
      name: Message
      title: Message
      summary: Message received, the event object has the same schema as the Message object in the API with the addition of an event type.
      payload:
        type: object
        properties:
          type:
            type: string
            const: Message
        required:
          - type
    MessageUpdate:
      name: MessageUpdate
      title: MessageUpdate
      summary: Message edited or otherwise updated.
      description: '`data` field contains a partial Message object.'
      payload:
        type: object
        properties:
          type:
            type: string
            const: MessageUpdate
          id:
            type: string
            description: message_id
          channel:
            type: string
            description: channel_id
          data:
            type: object
        required:
          - type
          - id
          - channel
          - data
    MessageAppend:
      name: MessageAppend
      title: MessageAppend
      summary: Message has data being appended to it.
      payload:
        type: object
        properties:
          type:
            type: string
            const: MessageAppend
          id:
            type: string
            description: message_id
          channel:
            type: string
            description: channel_id
          append:
            type: object
            properties:
              embeds:
                type: array
                items: {}
        required:
          - type
          - id
          - channel
          - append
    MessageDelete:
      name: MessageDelete
      title: MessageDelete
      summary: Message has been deleted.
      payload:
        type: object
        properties:
          type:
            type: string
            const: MessageDelete
          id:
            type: string
            description: message_id
          channel:
            type: string
            description: channel_id
        required:
          - type
          - id
          - channel
    MessageReact:
      name: MessageReact
      title: MessageReact
      summary: A reaction has been added to a message.
      payload:
        type: object
        properties:
          type:
            type: string
            const: MessageReact
          id:
            type: string
            description: message_id
          channel_id:
            type: string
          user_id:
            type: string
          emoji_id:
            type: string
        required:
          - type
          - id
          - channel_id
          - user_id
          - emoji_id
    MessageUnreact:
      name: MessageUnreact
      title: MessageUnreact
      summary: A reaction has been removed from a message.
      payload:
        type: object
        properties:
          type:
            type: string
            const: MessageUnreact
          id:
            type: string
            description: message_id
          channel_id:
            type: string
          user_id:
            type: string
          emoji_id:
            type: string
        required:
          - type
          - id
          - channel_id
          - user_id
          - emoji_id
    MessageRemoveReaction:
      name: MessageRemoveReaction
      title: MessageRemoveReaction
      summary: A certain reaction has been removed from the message.
      payload:
        type: object
        properties:
          type:
            type: string
            const: MessageRemoveReaction
          id:
            type: string
            description: message_id
          channel_id:
            type: string
          emoji_id:
            type: string
        required:
          - type
          - id
          - channel_id
          - emoji_id
    ChannelCreate:
      name: ChannelCreate
      title: ChannelCreate
      summary: Channel created, the event object has the same schema as the Channel object in the API with the addition of an event type.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelCreate
        required:
          - type
    ChannelUpdate:
      name: ChannelUpdate
      title: ChannelUpdate
      summary: Channel details updated.
      description: |
        - `data` field contains a partial Channel object.
        - `clear` field lists fields to remove: `Icon`, `Description`
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelUpdate
          id:
            type: string
            description: channel_id
          data:
            type: object
          clear:
            type: array
            items:
              type: string
              enum:
                - Icon
                - Description
        required:
          - type
          - id
          - data
    ChannelDelete:
      name: ChannelDelete
      title: ChannelDelete
      summary: Channel has been deleted.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelDelete
          id:
            type: string
            description: channel_id
        required:
          - type
          - id
    ChannelGroupJoin:
      name: ChannelGroupJoin
      title: ChannelGroupJoin
      summary: A user has joined the group.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelGroupJoin
          id:
            type: string
            description: channel_id
          user:
            type: string
            description: user_id
        required:
          - type
          - id
          - user
    ChannelGroupLeave:
      name: ChannelGroupLeave
      title: ChannelGroupLeave
      summary: A user has left the group.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelGroupLeave
          id:
            type: string
            description: channel_id
          user:
            type: string
            description: user_id
        required:
          - type
          - id
          - user
    ChannelStartTyping:
      name: ChannelStartTyping
      title: ChannelStartTyping
      summary: A user has started typing in this channel.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelStartTyping
          id:
            type: string
            description: channel_id
          user:
            type: string
            description: user_id
        required:
          - type
          - id
          - user
    ChannelStopTyping:
      name: ChannelStopTyping
      title: ChannelStopTyping
      summary: A user has stopped typing in this channel.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelStopTyping
          id:
            type: string
            description: channel_id
          user:
            type: string
            description: user_id
        required:
          - type
          - id
          - user
    ChannelAck:
      name: ChannelAck
      title: ChannelAck
      summary: You have acknowledged new messages in this channel up to this message ID.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ChannelAck
          id:
            type: string
            description: channel_id
          user:
            type: string
            description: user_id
          message_id:
            type: string
        required:
          - type
          - id
          - user
          - message_id
    ServerCreate:
      name: ServerCreate
      title: ServerCreate
      summary: Server created, the event object has the same schema as the SERVER object in the API with the addition of an event type.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ServerCreate
        required:
          - type
    ServerUpdate:
      name: ServerUpdate
      title: ServerUpdate
      summary: Server details updated.
      description: |
        - `data` field contains a partial Server object.
        - `clear` field lists fields to remove: `Icon`, `Banner`, `Description`
      payload:
        type: object
        properties:
          type:
            type: string
            const: ServerUpdate
          id:
            type: string
            description: server_id
          data:
            type: object
          clear:
            type: array
            items:
              type: string
              enum:
                - Icon
                - Banner
                - Description
        required:
          - type
          - id
          - data
    ServerDelete:
      name: ServerDelete
      title: ServerDelete
      summary: Server has been deleted.
      payload:
        type: object
        properties:
          type:
            type: string
            const: ServerDelete
          id:
            type: string
            description: server_id
        required:
          - type
          - id
    ServerMemberUpdate:
      name: ServerMemberUpdate
      title: ServerMemberUpdate
      summary: Server member details updated.
      description: |
        - `data` field contains a partial Server Member object.
        - `clear` field lists fields to remove: `Nickname`, `Avatar`
      payload:
        type: object
        properties:
