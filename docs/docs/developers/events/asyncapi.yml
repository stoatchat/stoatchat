    Auth:
      name: Auth
      title: Auth
      summary: Forwarded events from Authifier, currently only session deletion events are forwarded.
      description: |
        `event_type` may be one of:

        **DeleteSession** - A session has been deleted.
        ```json
        { "event_type": "DeleteSession", "user_id": "{user_id}", "session_id": "{session_id}" }
        ```

        **DeleteAllSessions** - All sessions for this account have been deleted, optionally excluding a given ID.
        ```json
        { "event_type": "DeleteAllSessions", "user_id": "{user_id}", "exclude_session_id": "{session_id}" }
        ```
      payload:
        type: object
        properties:
          type:
            type: string
            const: Auth
          event_type:
            type: string
            enum:
              - DeleteSession
              - DeleteAllSessions
          user_id:
            type: string
          session_id:
            type: string
          exclude_session_id:
            type: string
        required:
          - type
          - event_type
          - user_id